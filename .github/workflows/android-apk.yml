name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, for example v0.1.0'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build optimized APKs by CPU architecture
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs for this run
        uses: actions/upload-artifact@v4
        with:
          name: cmmr-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs from build
        uses: actions/download-artifact@v4
        with:
          name: cmmr-release-apks
          path: release-assets

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CMMR ${{ inputs.release_tag || github.ref_name }}
          body: |
            Optimized release APKs split by CPU architecture:
            - `armeabi-v7a`: older 32-bit ARM devices
            - `arm64-v8a`: most modern Android phones
            - `x86_64`: x86_64 devices and emulators

            Install the APK matching your device architecture.
          fail_on_unmatched_files: true
          files: release-assets/*-release.apk
